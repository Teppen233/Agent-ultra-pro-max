[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewcrew"
version = "0.1.0"
description = "面向 Git PR 的流式多 Agent 智能代码审查系统"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
agent = ["pydantic-ai>=0.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
]

[tool.setuptools.packages.find]
include = ["reviewcrew*", "benchmark*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

