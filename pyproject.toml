[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewcrew"
version = "0.1.0"
description = "AI Code Review 系统 —— 以 Agent 为核心的 Git PR 代码审查工具"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "LAM2360" }
]
keywords = ["code-review", "ai", "agent", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.0",
    "pydantic-ai>=0.0.10",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["reviewcrew", "benchmark"]
