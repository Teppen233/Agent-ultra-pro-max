[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reviewcrew"
version = "0.1.0"
description = "Multi-agent, diff-focused AI code review"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pyyaml>=6,<7",
  "tiktoken>=0.8,<1",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-language-pack>=0.7,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
signals = ["semgrep>=1.100,<2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
reviewcrew = "reviewcrew.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["reviewcrew", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "："]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
